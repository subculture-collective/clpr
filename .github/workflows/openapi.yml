name: OpenAPI Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/openapi/**'
      - '.redocly.lint-ignore.yaml'
      - 'redocly.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-openapi-lint-result.js'
      - 'scripts/tests/verify-openapi-lint-result.test.js'
      - 'backend/cmd/api/openapi_route_precedence_test.go'
      - '.github/workflows/openapi.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/openapi/**'
      - '.redocly.lint-ignore.yaml'
      - 'redocly.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-openapi-lint-result.js'
      - 'scripts/tests/verify-openapi-lint-result.test.js'
      - 'backend/cmd/api/openapi_route_precedence_test.go'
      - '.github/workflows/openapi.yml'

jobs:
  # docs/openapi/openapi.yaml is the sole supported API contract. Removed legacy
  # specs are intentionally outside the workflow instead of being linted with a
  # success override.
  validate:
    name: Validate OpenAPI Specs
    runs-on: ubuntu-24.04
    
    permissions:
      contents: read
      pull-requests: write  # For PR comments
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate OpenAPI spec
        run: npm run openapi:lint
      
      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking for breaking changes..."
          # Fetch base branch
          git fetch origin ${{ github.base_ref }}
          
          # Check if openapi.yaml exists in base branch
          if git show origin/${{ github.base_ref }}:docs/openapi/openapi.yaml > /tmp/base-openapi.yaml 2>/dev/null; then
            echo "Comparing with base branch..."
            ./node_modules/.bin/redocly diff /tmp/base-openapi.yaml docs/openapi/openapi.yaml
          else
            echo "No base OpenAPI spec found - skipping diff"
          fi
      
      - name: Generate API documentation
        run: |
          echo "Generating static documentation..."
          ./node_modules/.bin/redocly build-docs docs/openapi/openapi.yaml -o /tmp/api-docs.html
          echo "✓ Documentation generated successfully"
      
      - name: Upload documentation artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: /tmp/api-docs.html
          retention-days: 30
      
      - name: Comment PR with validation results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const body = status === 'success' 
              ? '✅ OpenAPI spec validation passed! The API documentation is valid and ready for use.'
              : '❌ OpenAPI spec validation failed. Please check the workflow logs for details.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
