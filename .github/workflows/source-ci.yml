name: Source CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, test, and vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -json ./... | tee test-results.json
      - name: Enforce owned, expiring skip budget
        run: bash scripts/verify-test-skip-policy.sh
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Build
        working-directory: backend
        run: go build ./cmd/api
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.json
          if-no-files-found: error

  frontend:
    name: Frontend lint, test, and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Reject high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Unit tests
        run: npm run test -- run --reporter=default --reporter=json --outputFile=test-results.json
      - run: npm run build
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-and-build
          path: |
            frontend/test-results.json
            frontend/dist
          if-no-files-found: error

  browser-smoke:
    name: Real-backend browser smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tools
        run: |
          npm --prefix frontend ci
          go install github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install supported browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify browser manifest
        run: bash scripts/verify-playwright-manifest.sh
      - name: Start repository services and migrate
        run: task test:setup
      - name: Run release-critical backend suites without skips
        run: bash scripts/run-release-critical-backend-tests.sh
      - name: Run real-backend smoke
        run: bash scripts/run-real-e2e.sh
      - name: Stop repository services
        if: always()
        run: task test:teardown || true
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
            .tmp/backend-e2e.log
            .tmp/release-critical-tests.json
          if-no-files-found: warn
