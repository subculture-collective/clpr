# Green pull requests in this organization merge themselves, so every
# ecosystem groups minor and patch updates into one pull request, ignores
# major versions and keeps at most two pull requests open.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Minor releases may change rendered Markdown output.
      - dependency-name: github.com/yuin/goldmark
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /
      - /frontend
      - /extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /backend
      - /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Go builder image is pinned by scripts/verify-go-toolchain-contract.sh
      # and must change together with backend/go.mod.
      - dependency-name: golang
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
