# Green pull requests in this organization merge themselves, so every
# ecosystem groups minor and patch updates into one pull request, ignores
# major versions, runs monthly and keeps at most one pull request open.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Minor releases may change rendered Markdown output.
      - dependency-name: github.com/yuin/goldmark
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /
      - /frontend
      - /extension
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 7.1 adds a lint rule that needs code changes first.
      - dependency-name: eslint-plugin-react-hooks
        update-types: ["version-update:semver-minor"]
      # Pre-1.0 or build-pipeline packages whose minor releases can break the
      # build, and packages whose minor releases can change rendered output.
      - dependency-name: esbuild
        update-types: ["version-update:semver-minor"]
      - dependency-name: rolldown
        update-types: ["version-update:semver-minor"]
      - dependency-name: lucide-react
        update-types: ["version-update:semver-minor"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@tailwindcss/postcss"
        update-types: ["version-update:semver-minor"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /backend
      - /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Go builder image is pinned by scripts/verify-go-toolchain-contract.sh
      # and must change together with backend/go.mod.
      - dependency-name: golang
      # A new Python or Alpine minor is a runtime upgrade, not a routine bump.
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
      - dependency-name: alpine
        update-types: ["version-update:semver-minor"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
