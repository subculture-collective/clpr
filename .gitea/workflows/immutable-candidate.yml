name: Immutable production candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    name: Build, scan, sign, and publish immutable candidate
    # Homelab deploy keys accept only Kvant's address (Kvant and its Kuznya VM); the kvant label keeps this job off Buran.
    runs-on: [ubuntu-24.04, kvant]
    timeout-minutes: 240
    env:
      OCI_SOURCE: https://git.subcult.tv/subculture-collective/clpr
      REGISTRY_ROOT: ghcr.io/subculture-collective/clpr
      TRIVY_IMAGE: aquasec/trivy:0.69.2@sha256:3d1f862cb6c4fe13c1506f96f816096030d8d5ccdb2380a3069f7bf07daa86aa
      SYFT_IMAGE: anchore/syft:v1.30.0@sha256:bd5357d2cd087f03af748dac24df48bfbc1723080d78f75f69aca1f2d429060e
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check current main and deployment access before building
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.server_url == 'https://git.subcult.tv'
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_WEB_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOMELAB_WEB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          current_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test "$current_main" = "${GITEA_SHA:-${GITHUB_SHA:-}}"
          umask 077
          deploy_dir="$(mktemp -d)"
          trap 'rm -rf "$deploy_dir"' EXIT
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          ssh -i "$deploy_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$deploy_dir/known_hosts" \
            -o ConnectTimeout=10 onnwee@10.0.0.200 status >/dev/null
      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: https://github.com/sigstore/cosign-installer@v3.8.2
        with:
          cosign-release: v2.4.3
      - name: Install deterministic gate dependencies
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/go-task/task/v3/cmd/task@v3.45.4
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          bash scripts/install-lychee.sh
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go -C backend mod download
          npm ci
          npm --prefix frontend ci
          npm --prefix frontend exec -- playwright install --with-deps chromium firefox webkit
      - name: Converge candidate source before image generation
        shell: bash
        run: |
          set -euo pipefail
          source scripts/configure-hosted-test-ports.sh
          bash scripts/source-convergence.sh \
            --phase contract --phase backend --phase frontend \
            --phase api-docs --phase docs --phase secrets \
            --phase browser --phase contracts
      # The convergence trap also tears down, but a cancelled or killed step
      # skips it. Remove this run's services and volumes unconditionally.
      - name: Remove isolated test services
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source scripts/configure-hosted-test-ports.sh
          docker compose -f docker-compose.test.yml down -v --remove-orphans
      - name: Authenticate to GHCR
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_TOKEN"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Build each image once, scan, SBOM, publish, and sign
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git status --porcelain=v1 --untracked-files=all)" = ''
          test "$candidate_sha" = "${GITEA_SHA:-${GITHUB_SHA:-}}"
          test -n "$COSIGN_PRIVATE_KEY"
          test -n "$COSIGN_PUBLIC_KEY"
          evidence_dir="$PWD/.tmp/release-candidate"
          mkdir -p "$evidence_dir"

          build_candidate() {
            name="$1"
            context="$2"
            dockerfile="$3"
            expected_user="$4"
            image="$REGISTRY_ROOT/$name:candidate-$candidate_sha"

            docker build \
              --build-arg "OCI_REVISION=$candidate_sha" \
              --build-arg "OCI_SOURCE=$OCI_SOURCE" \
              --file "$dockerfile" --tag "$image" "$context"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$candidate_sha"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$image")" = "$OCI_SOURCE"
            test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "$expected_user"

            if [[ "$name" == frontend ]]; then
              python3 scripts/ci/qualify-frontend.py "$image" "$candidate_sha" \
                >"$evidence_dir/frontend-http.json"
            fi

            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              "$TRIVY_IMAGE" image --scanners vuln --ignore-unfixed \
              --severity HIGH,CRITICAL --exit-code 1 --format json \
              "$image" >"$evidence_dir/$name-trivy.json"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              "$SYFT_IMAGE" "docker:$image" -o spdx-json \
              >"$evidence_dir/$name.spdx.json"
            test -s "$evidence_dir/$name-trivy.json"
            test -s "$evidence_dir/$name.spdx.json"

            # GHCR denies this registry credential a push to the render
            # package, and the candidate manifest does not list it. The
            # release copies this image from the runner, so it stops here.
            if [[ "$name" == render ]]; then
              return 0
            fi

            docker push "$image"
            repository_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
            digest="${repository_digest##*@}"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            immutable_ref="$REGISTRY_ROOT/$name@$digest"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$immutable_ref"
            cosign verify --key env://COSIGN_PUBLIC_KEY "$immutable_ref" >/dev/null
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
              --bundle "$evidence_dir/$name.spdx.sigstore.json" \
              "$evidence_dir/$name.spdx.json"
            printf -v "${name}_digest" '%s' "$digest"
          }

          build_candidate backend backend backend/Dockerfile 10001:10001
          build_candidate crawler backend backend/Dockerfile.crawler 10001:10001
          build_candidate render backend backend/Dockerfile.render 10001:10001
          build_candidate frontend . frontend/Dockerfile 101:101

          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$evidence_dir/candidate-manifest.json" "$candidate_sha" \
            "$backend_digest" "$frontend_digest" "$crawler_digest" "$built_at" <<'PY'
          import json
          import pathlib
          import sys
          path, sha, backend, frontend, crawler, built_at = sys.argv[1:]
          pathlib.Path(path).write_text(json.dumps({
              "schema_version": 1,
              "candidate_sha": sha,
              "backend_digest": backend,
              "frontend_digest": frontend,
              "crawler_digest": crawler,
              "built_at": built_at,
          }, indent=2) + "\n")
          PY
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          test "$(git status --porcelain=v1 --untracked-files=all)" = ''
      - name: Sign frontend delivery receipt
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          evidence_dir="$PWD/.tmp/release-candidate"
          image="$REGISTRY_ROOT/frontend:candidate-$candidate_sha"
          python3 scripts/ci/web-delivery.py prepare \
            --evidence "$evidence_dir" --image "$image" --revision "$candidate_sha" \
            >"$evidence_dir/frontend-delivery.json"
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
            --bundle "$evidence_dir/frontend-delivery.sigstore.json" \
            "$evidence_dir/frontend-delivery.json"
          cosign verify-blob --offline --key env://COSIGN_PUBLIC_KEY \
            --bundle "$evidence_dir/frontend-delivery.sigstore.json" \
            "$evidence_dir/frontend-delivery.json"
      - name: Upload immutable candidate manifest and supply-chain records
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: release-candidate-manifest
          path: .tmp/release-candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deliver signed frontend
    needs: candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.server_url == 'https://git.subcult.tv'
    # Homelab deploy keys accept only Kvant's address (Kvant and its Kuznya VM); the kvant label keeps this job off Buran.
    runs-on: [ubuntu-24.04, kvant]
    timeout-minutes: 20
    env:
      REGISTRY_ROOT: ghcr.io/subculture-collective/clpr
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: https://github.com/actions/download-artifact@v3
        with:
          name: release-candidate-manifest
          path: .tmp/release-candidate
      - uses: https://github.com/sigstore/cosign-installer@v3.8.2
        with:
          cosign-release: v2.4.3
      - name: Restore the qualified immutable frontend
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          evidence_dir="$PWD/.tmp/release-candidate"
          cosign verify-blob --offline --key env://COSIGN_PUBLIC_KEY \
            --bundle "$evidence_dir/frontend-delivery.sigstore.json" \
            "$evidence_dir/frontend-delivery.json"
          digest="$(python3 - "$evidence_dir/frontend-delivery.json" "$revision" <<'PY'
          import importlib.util, json, pathlib, sys
          path = pathlib.Path('scripts/ci/web-delivery.py')
          spec = importlib.util.spec_from_file_location('delivery', path)
          delivery = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(delivery)
          statement = delivery.validate_statement(json.loads(pathlib.Path(sys.argv[1]).read_text()), sys.argv[2])
          print(statement['candidate']['frontend_digest'])
          PY
          )"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          image="$REGISTRY_ROOT/frontend@$digest"
          cosign verify --key env://COSIGN_PUBLIC_KEY "$image" >/dev/null
          docker pull "$image"
          docker tag "$image" "$REGISTRY_ROOT/frontend:candidate-$revision"
      - name: Deploy qualified frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.server_url == 'https://git.subcult.tv'
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_WEB_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOMELAB_WEB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          deploy_dir="$(mktemp -d)"
          trap 'rm -rf "$deploy_dir"' EXIT
          chmod 700 "$deploy_dir"
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          chmod 600 "$deploy_dir/key" "$deploy_dir/known_hosts"
          ssh_args=(-i "$deploy_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$deploy_dir/known_hosts"
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          clpr_remote() {
            # Fixed protocol commands deliberately contain the validated client-side revision.
            # shellcheck disable=SC2029
            ssh "${ssh_args[@]}" onnwee@10.0.0.200 "$1"
          }
          python3 - .tmp/release-candidate <<'PY' | clpr_remote "attest $revision"
          import base64, json, pathlib, sys
          folder = pathlib.Path(sys.argv[1])
          print(json.dumps({name: base64.b64encode((folder / filename).read_bytes()).decode()
                            for name, filename in [('statement', 'frontend-delivery.json'),
                                                   ('bundle', 'frontend-delivery.sigstore.json')]}))
          PY
          accepted="$(clpr_remote "artifact $revision clpr-frontend")"
          if python3 -c 'import json,sys;sys.exit(0 if json.loads(sys.argv[1])["available"] else 1)' "$accepted"; then
            echo "Reusing the first accepted signed frontend for this revision."
          else
            transport="fleet-deploy/clpr-web/clpr-frontend:$revision"
            docker tag "$REGISTRY_ROOT/frontend:candidate-$revision" "$transport"
            docker save "$transport" | clpr_remote "receive $revision clpr-frontend"
          fi
          clpr_remote "deploy $revision"
          clpr_remote "verify-native $revision"
          python3 - "$revision" <<'PY'
          import json, sys, time, urllib.error, urllib.request
          revision = sys.argv[1]
          for query in ['', '?v=' + revision, '?v=stale']:
              request = urllib.request.Request('https://clpr.tv/build-info.json' + query,
                                              headers={'User-Agent': 'SUBCULT-deploy/1', 'Cache-Control': 'no-cache'})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          assert response.status == 200
                          assert json.load(response) == {'source_commit': revision, 'repository': 'subculture-collective/clpr'}
                          assert response.headers.get('Cache-Control') == 'no-store'
                      break
                  except urllib.error.HTTPError as error:
                      if error.code < 500 or attempt == 2:
                          raise
                  except urllib.error.URLError:
                      if attempt == 2:
                          raise
                  time.sleep(1)
          print(json.dumps({'source_commit': revision, 'public_marker': 'PASS', 'uncached_queries': 3}))
          PY
