  /api/v1/moderation/sync-bans:
    post:
      tags: [Moderation]
      summary: Sync bans from Twitch
      description: |
        Synchronizes ban status from Twitch for a specific channel. This endpoint triggers an asynchronous 
        background job that syncs ban data from Twitch. The operation has a 5-minute timeout.
        
        **Required Permissions**: Channel owner, moderator, or admin
        
        **Rate Limit**: 5 requests per hour
        
        **Requirements**:
        - Valid Twitch moderator OAuth scopes
        - Moderator permissions on the target channel
      operationId: syncBans
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel_id
              properties:
                channel_id:
                  type: string
                  format: uuid
                  description: Channel ID to sync bans for
                  example: "123e4567-e89b-12d3-a456-426614174000"
            examples:
              syncChannel:
                summary: Sync bans for a channel
                value:
                  channel_id: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Ban sync started successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - job_id
                  - message
                properties:
                  status:
                    type: string
                    enum: [syncing]
                    description: Current sync status
                  job_id:
                    type: string
                    format: uuid
                    description: Unique identifier for the sync job
                  message:
                    type: string
                    description: Human-readable status message
              examples:
                success:
                  summary: Sync started
                  value:
                    status: "syncing"
                    job_id: "987fcdeb-51a2-43c1-b789-123456789abc"
                    message: "Ban sync started for channel 123e4567-e89b-12d3-a456-426614174000"
        '400':
          description: Bad request - Invalid or missing channel_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidChannelId:
                  summary: Invalid channel ID
                  value:
                    error: "channel_id is required and must be a valid UUID"
                    code: "INVALID_REQUEST"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Service unavailable - Twitch ban sync service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                serviceUnavailable:
                  summary: Service unavailable
                  value:
                    error: "Twitch ban sync service is currently unavailable"
                    code: "SERVICE_UNAVAILABLE"

  /api/v1/moderation/bans:
    get:
      tags: [Moderation]
      summary: List channel bans
      description: |
        Retrieves a paginated list of bans for a specific channel.
        
        **Required Permissions**: Channel owner, moderator, or admin
        
        **Rate Limit**: 60 requests per minute
      operationId: getBans
      security:
        - BearerAuth: []
      parameters:
        - name: channelId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Channel ID to list bans for
          example: "123e4567-e89b-12d3-a456-426614174000"
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Number of results per page
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of results to skip (must be multiple of limit)
      responses:
        '200':
          description: List of bans retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - bans
                  - total
                  - limit
                  - offset
                properties:
                  bans:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ban'
                  total:
                    type: integer
                    description: Total number of bans
                  limit:
                    type: integer
                    description: Results per page
                  offset:
                    type: integer
                    description: Current offset
              examples:
                success:
                  summary: List of bans
                  value:
                    bans:
                      - id: "98765432-e89b-12d3-a456-426614174001"
                        user_id: "456e4567-e89b-12d3-a456-426614174002"
                        banned_by_id: "789e4567-e89b-12d3-a456-426614174003"
                        reason: "Violation of community guidelines"
                        duration_hours: null
                        expires_at: null
                        is_permanent: true
                        created_at: "2024-01-15T10:30:00Z"
                    total: 150
                    limit: 20
                    offset: 0
        '400':
          description: Bad request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingChannelId:
                  summary: Missing channel ID
                  value:
                    error: "channelId is required and must be a valid UUID"
                    code: "INVALID_REQUEST"
                invalidOffset:
                  summary: Invalid offset
                  value:
                    error: "offset must be a multiple of limit"
                    code: "INVALID_REQUEST"
                    details:
                      offset: 15
                      limit: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  summary: Permission denied
                  value:
                    error: "Permission denied: You do not have access to view bans for this channel"
                    code: "FORBIDDEN"
        '404':
          description: Not found - Channel does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                channelNotFound:
                  summary: Channel not found
                  value:
                    error: "Channel not found"
                    code: "NOT_FOUND"
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Moderation]
      summary: Create ban
      description: |
        Creates a new ban for a user in a specific channel. Permanent bans are created by default.
        
        **Required Permissions**: Channel owner, admin, or moderator
        
        **Rate Limit**: 10 requests per hour
        
        **Notes**:
        - Cannot ban the channel owner
        - Creates an audit log entry automatically
        - Broadcasts ban event via WebSocket
      operationId: createBan
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channelId
                - userId
              properties:
                channelId:
                  type: string
                  format: uuid
                  description: Channel ID where user will be banned
                userId:
                  type: string
                  format: uuid
                  description: User ID to ban
                reason:
                  type: string
                  maxLength: 1000
                  description: Reason for the ban
            examples:
              permanentBan:
                summary: Create permanent ban
                value:
                  channelId: "123e4567-e89b-12d3-a456-426614174000"
                  userId: "456e4567-e89b-12d3-a456-426614174002"
                  reason: "Violation of community guidelines"
              banWithReason:
