        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  summary: Permission denied
                  value:
                    error: "Permission denied: You must be a channel owner, admin, or moderator to ban users"
