              examples:
                success:
                  summary: Ban created
                  value:
                    id: "98765432-e89b-12d3-a456-426614174001"
                    user_id: "456e4567-e89b-12d3-a456-426614174002"
                    banned_by_id: "789e4567-e89b-12d3-a456-426614174003"
                    reason: "Violation of community guidelines"
                    duration_hours: null
                    expires_at: null
                    is_permanent: true
                    created_at: "2024-01-15T10:30:00Z"
        '400':
          description: Bad request - Invalid parameters or cannot ban owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUuid:
                  summary: Invalid UUID format
