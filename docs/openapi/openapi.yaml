  # ========================================
  # Search
  # ========================================
  /api/v1/search:
    get:
      tags: [Search]
      summary: Search clips
      description: Full-text search for clips (rate limited - 60/minute)
      operationId: search
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          schema:
            type: string
            enum: [clips, creators, games, tags, all]
            default: all
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [query, results, counts, meta]
                properties:
                  query:
                    type: string
                  results:
                    type: object
                    required: [clips, creators, games, tags]
                    properties:
                      clips:
                        type: array
                        items:
                          $ref: '#/components/schemas/Clip'
                      creators:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                      games:
                        type: array
                        items:
                          type: object
                          required: [id, name, clip_count]
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            clip_count:
                              type: integer
                              minimum: 0
                      tags:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tag'
                  counts:
                    type: object
                    required: [clips, creators, games, tags]
                    properties:
                      clips: {type: integer, minimum: 0}
                      creators: {type: integer, minimum: 0}
                      games: {type: integer, minimum: 0}
                      tags: {type: integer, minimum: 0}
                  meta:
                    type: object
                    required: [page, limit, total_items, total_pages]
                    properties:
                      page: {type: integer, minimum: 1}
                      limit: {type: integer, minimum: 1, maximum: 100}
                      total_items: {type: integer, minimum: 0}
                      total_pages: {type: integer, minimum: 0}
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

