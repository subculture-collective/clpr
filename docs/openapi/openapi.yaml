components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from authentication endpoints
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly JWT session cookie. State-changing requests authenticated this way also require the csrf_token cookie value in X-CSRF-Token.
    OperationalAuth:
      type: http
      scheme: bearer
      description: Dedicated machine credential for internal operational diagnostics

  parameters:
    StartDate:
      name: start_date
      in: query
      description: Inclusive start date.
      schema: {type: string, format: date}

    EndDate:
      name: end_date
      in: query
      description: Inclusive end date; ranges may not exceed 366 days.
      schema: {type: string, format: date}

    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for POST, PUT, PATCH, and DELETE when authentication uses the access_token cookie; not required with BearerAuth.
      schema:
        type: string
        minLength: 43
        maxLength: 64

    CreatorAnalyticsName:
      name: creator
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 100}

    DiscoveryListIdentifier:
      name: id
      in: path
      required: true
      description: Discovery-list UUID or slug.
      schema: {type: string, minLength: 1, maxLength: 200}

    DiscoveryListUUID:
      name: id
      in: path
      required: true
      description: Discovery-list UUID.
      schema: {type: string, format: uuid}

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number for pagination
    
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page
    
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
