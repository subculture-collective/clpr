              properties:
                profile_visibility:
                  type: string
                  enum: [public, private, followers]
                show_karma_publicly:
                  type: boolean
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/me/consent:
    get:
      tags: [Users]
      summary: Get cookie consent
      description: Returns current user's cookie consent preferences
      operationId: getConsent
      responses:
        '200':
          description: Consent preferences
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Users]
      summary: Save cookie consent
      description: Saves cookie consent preferences (rate limited - 30/minute)
      operationId: saveConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [essential]
              properties:
                essential:
                  type: boolean
                functional:
                  type: boolean
                analytics:
                  type: boolean
                advertising:
                  type: boolean
      responses:
        '200':
          description: Consent saved
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/users/me/email-logs:
    get:
      tags: [Users]
      summary: Get email logs
      description: Returns email logs for current user
      operationId: getUserEmailLogs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Email logs
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'


# Component Schemas
# ========================================
  /api/v1/admin/account-types/conversions:
    get:
      tags: [Admin]
      summary: List recent account-type conversions
      description: Requires an administrator session with MFA. Results are ordered from newest to oldest.
      operationId: getApiV1AdminAccountTypesConversions
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Recent conversions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountTypeConversionsResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/admin/account-types/stats:
    get:
      tags: [Admin]
      summary: Get account-type totals
      description: Requires an administrator session with MFA.
      operationId: getApiV1AdminAccountTypesStats
      responses:
        '200':
          description: Counts for every supported account type
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountTypeStatsResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/admin/account-types/users/{id}/convert-to-moderator:
    post:
      tags: [Admin]
      summary: Convert a user to a moderator account
      description: Requires an administrator session with MFA. Cookie-authenticated requests must also send the CSRF token.
      operationId: postApiV1AdminAccountTypesUsersIdConvertToModerator
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: [string, 'null']
                  maxLength: 500
      responses:
        '200':
          description: User converted to moderator
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountTypeConversionResult'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/users/me/convert-to-broadcaster:
    post:
      tags: [Users]
      summary: Convert the current account to broadcaster
      description: Converts the authenticated member account to broadcaster. Cookie-authenticated requests must also send the CSRF token.
      operationId: postApiV1UsersMeConvertToBroadcaster
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: [string, 'null']
                  maxLength: 500
      responses:
        '200':
          description: Account converted to broadcaster
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountTypeConversionResult'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/users/{id}/account-type:
    get:
      tags: [Users]
      summary: Get a user's account type
      description: Returns the account type, permissions, and any included conversion history for the requested user.
      operationId: getApiV1UsersIdAccountType
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Account-type information
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountTypeInfoResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/users/{id}/account-type/history:
    get:
      tags: [Users]
      summary: List a user's account-type conversion history
      description: Returns account-type conversions for the requested user, ordered from newest to oldest.
      operationId: getApiV1UsersIdAccountTypeHistory
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Conversion history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountTypeConversionsResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook subscriptions
      description: Lists outbound webhook subscriptions owned by the authenticated user.
      operationId: getApiV1Webhooks
      responses:
        '200':
          description: Webhook subscriptions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSubscriptionListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      tags: [Webhooks]
      summary: Create a webhook subscription
      description: Creates an outbound webhook subscription. The signing secret is returned only by this response. Cookie-authenticated requests must also send the CSRF token.
      operationId: postApiV1Webhooks
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWebhookSubscriptionRequest'}
      responses:
        '201':
          description: Subscription created and signing secret issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSubscriptionCreatedResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/webhooks/events:
    get:
      tags: [Webhooks]
      summary: List supported webhook events
      operationId: getApiV1WebhooksEvents
      responses:
        '200':
          description: Supported event identifiers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookEventsResponse'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/v1/webhooks/{id}:
    get:
      tags: [Webhooks]
      summary: Get a webhook subscription
      operationId: getApiV1WebhooksId
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Webhook subscription
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSubscriptionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Webhooks]
      summary: Update a webhook subscription
      description: Updates mutable subscription settings. Cookie-authenticated requests must also send the CSRF token.
      operationId: patchApiV1WebhooksId
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWebhookSubscriptionRequest'}
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookMutationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    delete:
      tags: [Webhooks]
      summary: Delete a webhook subscription
      description: Permanently deletes the subscription. Cookie-authenticated requests must also send the CSRF token.
      operationId: deleteApiV1WebhooksId
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Subscription deleted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookMutationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/webhooks/{id}/deliveries:
    get:
      tags: [Webhooks]
      summary: List webhook delivery attempts
      operationId: getApiV1WebhooksIdDeliveries
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Paginated delivery attempts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDeliveriesResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/webhooks/{id}/regenerate-secret:
    post:
      tags: [Webhooks]
      summary: Regenerate a webhook signing secret
      description: Invalidates the previous secret and returns its replacement once. Cookie-authenticated requests must also send the CSRF token.
      operationId: postApiV1WebhooksIdRegenerateSecret
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Replacement signing secret
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSecretResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/watch-history:
    get:
      tags: [Users]
      summary: Get the current user's watch history
      operationId: getApiV1WatchHistory
      parameters:
        - name: filter
          in: query
          schema: {type: string, enum: [all, completed, in-progress], default: all}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Watch-history entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchHistoryResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      tags: [Users]
      summary: Record clip watch progress
      description: Records a bounded progress position when watch-history tracking is enabled. Cookie-authenticated requests must also send the CSRF token.
      operationId: postApiV1WatchHistory
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordWatchProgressRequest'}
      responses:
        '200':
          description: Progress recorded or tracking disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchProgressResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    delete:
      tags: [Users]
      summary: Clear the current user's watch history
      description: Permanently deletes all watch-history entries for the authenticated user. Cookie-authenticated requests must also send the CSRF token.
      operationId: deleteApiV1WatchHistory
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Watch history cleared
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchHistoryClearedResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/contact:
    post:
      tags: [Support]
      summary: Submit a contact message
      description: Submits a rate-limited support request. Authentication is optional; authenticated requests associate the message with the current user.
      operationId: postApiV1Contact
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateContactMessageRequest'}
      responses:
        '201':
          description: Contact message accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactSubmissionResponse'}
        '400':
          description: Invalid contact message
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500':
          description: Contact message could not be stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}

  /api/v1/admin/contact:
    get:
      tags: [Admin, Support]
      summary: List contact messages
      description: Requires an administrator session with MFA. Responses contain private submitter and abuse-prevention data.
      operationId: getApiV1AdminContact
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: category
          in: query
          schema: {type: string, enum: [abuse, account, billing, feedback]}
        - name: status
          in: query
          schema: {type: string, enum: [pending, reviewed, resolved]}
      responses:
        '200':
          description: Paginated contact messages
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactMessageListResponse'}
        '400':
          description: Invalid filter or pagination value
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500':
          description: Contact messages could not be retrieved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}

  /api/v1/admin/contact/{id}/status:
    put:
      tags: [Admin, Support]
      summary: Update a contact message status
      description: Requires an administrator session with MFA. Cookie-authenticated requests must also send the CSRF token.
      operationId: putApiV1AdminContactIdStatus
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateContactMessageStatusRequest'}
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactStatusUpdateResponse'}
        '400':
          description: Invalid message ID or status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Contact message not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}
        '500':
          description: Status could not be updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}

  /api/v1/admin/reports:
    get:
      tags: [Admin, Reports]
      summary: List content reports
      description: Requires an administrator session with MFA.
      operationId: getApiV1AdminReports
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, reviewed, actioned, dismissed]}
        - name: type
          in: query
          schema: {type: string, enum: [clip, comment, user]}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Paginated reports
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/admin/reports/{id}:
    get:
      tags: [Admin, Reports]
      summary: Get a content report
      description: Requires an administrator session with MFA. Includes reporter information and reports for the same target.
      operationId: getApiV1AdminReportsId
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Report details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportDetailResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Admin, Reports]
      summary: Resolve a content report
      description: Requires an administrator session with MFA. Unsupported or incompatible moderation actions fail closed. Cookie-authenticated requests must also send the CSRF token.
      operationId: putApiV1AdminReportsId
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateReportRequest'}
      responses:
        '200':
          description: Report updated after any moderation action succeeded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportUpdateResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/events:
    post:
      tags: [Analytics]
      summary: Queue one or more analytics events
      description: Accepts a single event or a batch of up to 100 events. A response confirms queue acceptance, not database persistence. Requests are limited to 64 KiB and 100 requests per minute.
      operationId: postApiV1Events
      parameters:
        - name: X-Session-ID
          in: header
          required: false
          schema: {type: string, maxLength: 100}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/TrackEventRequest'}
                - {$ref: '#/components/schemas/BatchEventsRequest'}
      responses:
        '202':
          description: Event or complete batch accepted into the queue
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/EventAcceptedResponse'}
                  - {$ref: '#/components/schemas/EventBatchResponse'}
        '207':
          description: Only part of the batch was accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventBatchResponse'}
        '400':
          description: Invalid event, batch, or session identifier
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}
        '413':
          description: Request exceeds 64 KiB
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500':
          description: Event could not be queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}
        '503':
          description: Event queue is saturated; retry later
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ContactErrorResponse'}
                  - {$ref: '#/components/schemas/EventBatchResponse'}

  /api/v1/feeds/analytics:
    get:
      tags: [Admin, Analytics]
      summary: Get aggregate feed event metrics
      description: Requires an administrator session.
      operationId: getApiV1FeedsAnalytics
      parameters:
        - name: hours
          in: query
          schema: {type: integer, minimum: 1, maximum: 720, default: 24}
      responses:
        '200':
          description: Aggregate event metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedEventMetricsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/feeds/analytics/hourly:
    get:
      tags: [Admin, Analytics]
      summary: Get hourly metrics for an event type
      description: Requires an administrator session.
      operationId: getApiV1FeedsAnalyticsHourly
      parameters:
        - name: event_type
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 100}
        - name: hours
          in: query
          schema: {type: integer, minimum: 1, maximum: 720, default: 24}
      responses:
        '200':
          description: Hourly event metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HourlyEventMetricsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/admin/webhooks/dlq:
    get:
      tags: [Admin, Webhooks]
      summary: List outbound webhook dead-letter items
      description: Requires an administrator session with MFA.
      operationId: getApiV1AdminWebhooksDlq
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Paginated dead-letter items
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDLQListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/admin/webhooks/dlq/{id}:
    delete:
      tags: [Admin, Webhooks]
      summary: Permanently delete a dead-letter item
      description: Requires an administrator session with MFA. Cookie-authenticated requests must also send the CSRF token.
      operationId: deleteApiV1AdminWebhooksDlqId
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Item deleted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDLQMutationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/admin/webhooks/dlq/{id}/replay:
    post:
      tags: [Admin, Webhooks]
      summary: Replay a dead-lettered webhook
      description: Atomically claims and redelivers an item once. Concurrent or already-successful replay attempts fail with 409. Requires administrator MFA; cookie-authenticated requests must also send the CSRF token.
      operationId: postApiV1AdminWebhooksDlqIdReplay
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Replay delivered successfully
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDLQMutationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Item is currently replaying or was already replayed successfully
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}
        '502':
          description: Downstream replay failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}

  /internal/operations/webhooks:
    get:
      tags: [Operations, Webhooks]
      summary: Get webhook delivery and retry health
      description: Requires the dedicated operational bearer token. Returns 503 rather than reporting healthy when delivery statistics are incomplete.
      operationId: getInternalOperationsWebhooks
      security:
        - OperationalAuth: []
      responses:
        '200':
          description: Complete webhook operational statistics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookOperationsHealthyResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500':
          description: Retry queue statistics unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}
        '503':
          description: Delivery statistics unavailable; partial retry statistics returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookOperationsDegradedResponse'}

  /api/v1/webhooks/sendgrid:
    post:
      tags: [Webhooks]
      summary: Ingest signed SendGrid event notifications
      description: Verifies SendGrid's ECDSA signature and five-minute timestamp window before processing 1–1000 events. Payloads are limited to 1 MiB. A 500 response requests provider retry when any event could not be persisted.
      operationId: postApiV1WebhooksSendgrid
      security: []
      parameters:
        - name: X-Twilio-Email-Event-Webhook-Signature
          in: header
          required: true
          schema: {type: string, minLength: 1}
        - name: X-Twilio-Email-Event-Webhook-Timestamp
          in: header
          required: true
          schema: {type: string, pattern: '^[0-9]+$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 1000
              items: {$ref: '#/components/schemas/SendGridWebhookEvent'}
      responses:
        '200':
          description: Every event processed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendGridWebhookSuccessResponse'}
        '400':
          description: Invalid JSON, batch bounds, or required event fields
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}
        '401':
          description: Missing, stale, future, or invalid SendGrid signature
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}
        '413':
          description: Payload exceeds 1 MiB
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}
        '500':
          description: One or more verified events could not be persisted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendGridWebhookFailureResponse'}
        '503':
          description: Signature verification key is unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactErrorResponse'}

  /api/v1/admin/revenue:
    get:
      tags: [Admin, Payments]
      summary: Get subscription revenue metrics
      description: Requires an administrator session with MFA. Monetary values are integer-compatible cents; recognized revenue comes from paid invoice amounts while MRR uses monthly recurring equivalents. The endpoint fails closed when any metric query is incomplete.
      operationId: getApiV1AdminRevenue
      responses:
        '200':
          description: Complete revenue dashboard metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevenueMetrics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500':
          description: One or more revenue metrics could not be calculated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevenueMetricsError'}

  /api/v1/broadcasters/live:
    get:
      tags: [Broadcasters]
      summary: List currently live broadcasters
      description: Returns only statuses checked within the last two minutes, ordered by viewer count.
      operationId: getApiV1BroadcastersLive
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Fresh live broadcaster statuses
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LiveBroadcasterListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/broadcasters/{id}/live-status:
    get:
      tags: [Broadcasters]
      summary: Get a broadcaster's live status
      description: A stored live record older than two minutes is returned as offline with is_stale set to true.
      operationId: getApiV1BroadcastersIdLiveStatus
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 100}
      responses:
        '200':
          description: Live status, or a default offline status when none has been observed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BroadcasterLiveStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/admin/sync/clips:
    post:
      tags: [Admin, Clips]
      summary: Run a clip synchronization
      description: Runs a bounded synchronous Twitch clip import. Requires administrator MFA; cookie-authenticated requests must also send the CSRF token. Item-level failures produce 207 rather than full success.
      operationId: postApiV1AdminSyncClips
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TriggerClipSyncRequest'}
      responses:
        '200':
          description: Sync completed without item errors
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClipSyncResult'}
        '207':
          description: Sync completed with one or more item errors
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClipSyncResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/admin/sync/status:
    get:
      tags: [Admin, Clips]
      summary: Get persisted clip synchronization status
      description: Returns the most recent persisted clip import time rather than a synthetic service-ready placeholder. Requires administrator MFA.
      operationId: getApiV1AdminSyncStatus
      responses:
        '200':
          description: Last persisted synchronization evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClipSyncStatusResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /internal/operations/cache:
    get:
      tags: [Operations]
      summary: Get typed Redis operational statistics
