                channelNotFound:
                  summary: Channel not found
                  value:
                    error: Channel not found
                    code: NOT_FOUND
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Moderation
      summary: Create ban
      description: |
        Creates a new ban for a user in a specific channel. Permanent bans are created by default.

        **Required Permissions**: Channel owner, admin, or moderator

        **Rate Limit**: 10 requests per hour

        **Notes**:
        - Cannot ban the channel owner
        - Creates an audit log entry automatically
        - Broadcasts ban event via WebSocket
      operationId: createBan
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channelId
                - userId
              properties:
                channelId:
                  type: string
                  format: uuid
                  description: Channel ID where user will be banned
                userId:
                  type: string
                  format: uuid
                  description: User ID to ban
                reason:
                  type: string
                  maxLength: 1000
                  description: Reason for the ban
            examples:
              permanentBan:
                summary: Create permanent ban
                value:
                  channelId: 123e4567-e89b-12d3-a456-426614174000
                  userId: user-uuid-to-ban
                  reason: Violation of community guidelines
              banWithReason:
                summary: Ban with detailed reason
                value:
                  channelId: 123e4567-e89b-12d3-a456-426614174000
                  userId: user-uuid-to-ban
                  reason: Repeated harassment of community members. Multiple warnings issued.
      responses:
        '201':
          description: Ban created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ban'
              examples:
                success:
                  summary: Ban created
                  value:
                    id: ban-uuid-here
                    channelId: 123e4567-e89b-12d3-a456-426614174000
                    userId: user-uuid-to-ban
                    bannedBy: moderator-uuid-here
