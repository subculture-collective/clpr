openapi: 3.1.0
info:
  title: Clipper API
  description: |
    Complete API documentation for the Clipper platform - a social platform for Twitch clip curation and sharing.

    ## Authentication
    Most endpoints require authentication via JWT Bearer token:
    ```
    Authorization: Bearer <your_jwt_token>
    ```

    ## Rate Limiting
    API endpoints are rate-limited to prevent abuse. Rate limits vary by endpoint and are documented in each operation.
    Common limits:
    - Public endpoints: 60-100 requests/minute
    - Authenticated actions: 10-30 requests/minute
    - Submission operations: 5-10 requests/hour

    ## Pagination
    List endpoints support pagination via `page` and `limit` query parameters.
    Default limit is 20, maximum is 100.

    ## Errors
    The API uses standard HTTP status codes:
    - 200: Success
    - 201: Created
    - 400: Bad Request
    - 401: Unauthorized
    - 403: Forbidden
    - 404: Not Found
    - 429: Too Many Requests
    - 500: Internal Server Error
  version: 1.0.0
  contact:
    name: Clipper API Support
    url: https://git.subcult.tv/subculture-collective/clpr
    email: support@clpr.tv
  license:
    name: MIT
    url: https://git.subcult.tv/subculture-collective/clpr/blob/main/LICENSE
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://staging.clpr.tv
    description: Staging environment
  - url: https://api.clpr.tv
    description: Production API server
security:
  - BearerAuth: []
  - CookieAuth: []
tags:
  - name: Health
    description: Health check and monitoring endpoints
  - name: Authentication
    description: User authentication and OAuth
  - name: MFA
    description: Multi-factor authentication
  - name: Clips
    description: Clip management and discovery
  - name: Comments
    description: Comment and reply operations
  - name: Tags
    description: Tag management and discovery
  - name: Search
    description: Search functionality
  - name: Submissions
    description: User clip submissions
  - name: Reports
    description: Content reporting
  - name: Moderation
    description: Moderation and appeals
  - name: Users
    description: User profiles and social features
  - name: Creators
    description: Creator analytics and tools
  - name: Broadcasters
    description: Broadcaster profiles and content
  - name: Categories
    description: Content categories
  - name: Streams
    description: Live stream integration
  - name: Games
    description: Game discovery and following
  - name: Discovery
    description: Discovery lists and recommendations
  - name: Leaderboards
    description: User rankings and leaderboards
  - name: Feeds
    description: Content feeds
  - name: Recommendations
    description: Personalized recommendations
  - name: Notifications
    description: User notifications
  - name: Verification
    description: Creator verification
  - name: Subscriptions
    description: Premium subscriptions
  - name: Webhooks
    description: Webhook management
  - name: Contact
    description: Contact form
  - name: Chat
    description: Chat channels and messaging
  - name: Ads
    description: Advertisement system
  - name: Documentation
    description: API documentation
  - name: Communities
    description: Community management
  - name: Playlists
    description: Playlist management
  - name: Forum
    description: Forum discussions
  - name: Queue
    description: Playback queue
  - name: Watch History
    description: Watch history and progress
  - name: Watch Parties
    description: Watch party features
  - name: Service Status
    description: Service status and incidents
  - name: Admin
    description: Administrative operations
paths:
  /sitemap.xml:
    get:
      tags:
        - Health
      summary: Get sitemap XML
      description: Returns sitemap for search engine crawlers
      operationId: getSitemap
      security: []
      responses:
        '200':
          description: Sitemap XML
          content:
            application/xml:
              schema:
                type: string
  /robots.txt:
    get:
      tags:
        - Health
      summary: Get robots.txt
      description: Returns robots.txt for search engine crawlers
      operationId: getRobotsTxt
      security: []
      responses:
        '200':
          description: robots.txt content
          content:
            text/plain:
              schema:
                type: string
  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness check
      description: Returns 200 when required services are ready; optional dependency failures are listed as degradation
      operationId: getHealthReady
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - degraded_dependencies
                properties:
                  status:
                    type: string
                    const: ready
                  degraded_dependencies:
                    type: array
                    items:
                      type: string
                    example:
                      - opensearch
        '503':
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: not ready
  /health/live:
    get:
      tags:
        - Health
      summary: Liveness check
      description: Returns 200 if service is alive
      operationId: getHealthLive
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /health/stats:
    get:
      tags:
        - Health
      summary: Health statistics
      description: Returns database connection stats and other health metrics
      operationId: getHealthStats
      security: []
      responses:
        '200':
          description: Health statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  database:
                    type: object
                    properties:
                      max_connections:
                        type: integer
                      open_connections:
                        type: integer
                      in_use:
                        type: integer
                      idle:
                        type: integer
  /health/cache:
    get:
      tags:
        - Health
      summary: Cache statistics
      description: Returns Redis cache statistics
      operationId: getCacheStats
      security: []
      responses:
        '200':
          description: Cache statistics
          content:
            application/json:
              schema:
                type: object
  /health/cache/check:
    get:
      tags:
        - Health
      summary: Cache health check
      description: Verifies Redis cache connectivity
      operationId: getCacheHealth
      security: []
      responses:
        '200':
          description: Cache is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - cache
                properties:
                  status:
                    type: string
                    const: healthy
                  cache:
                    type: string
                    const: ok
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health/webhooks:
    get:
      tags:
        - Health
      summary: Webhook retry statistics
      description: Returns webhook delivery retry statistics
      operationId: getWebhookRetryStats
      security: []
      responses:
        '200':
          description: Webhook statistics
          content:
            application/json:
              schema:
                type: object
  /debug/metrics:
    get:
      tags:
        - Health
      summary: Prometheus metrics
      description: Returns Prometheus metrics (debug mode only)
      operationId: getMetrics
      security: []
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
  /api/v1/health:
    get:
      tags:
        - Health
      summary: API health check
      description: Basic health check for v1 API
      operationId: getApiV1Health
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/ping:
    get:
      tags:
        - Health
      summary: Ping endpoint
      description: Simple ping to check API responsiveness
      operationId: ping
      security: []
      responses:
        '200':
          description: Pong response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong
  /api/v1/config:
    get:
      tags:
        - Health
      summary: Get public configuration
      description: Returns public configuration values (features, limits, etc.)
      operationId: getPublicConfig
      security: []
      responses:
        '200':
          description: Public configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  features:
                    type: object
                  limits:
                    type: object
  /api/v1/logs:
    post:
      tags:
        - Health
      summary: Submit application logs
      description: Submit client-side application logs (rate limited - 60/minute)
      operationId: submitLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                level:
                  type: string
                  enum:
                    - debug
                    - info
                    - warn
                    - error
                message:
                  type: string
                context:
                  type: object
      responses:
        '204':
          description: Log submitted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/logs/stats:
    get:
      tags:
        - Health
      summary: Get log statistics
      description: Returns aggregated log statistics (rate limited - 30/minute)
      operationId: getLogStats
      responses:
        '200':
          description: Log statistics
          content:
            application/json:
              schema:
                type: object
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/twitch:
    get:
      tags:
        - Authentication
      summary: Initiate Twitch OAuth
      description: Redirects to Twitch OAuth authorization (rate limited - 30/minute)
      operationId: initiateTwitchOAuth
      security: []
      parameters:
        - name: redirect_uri
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to Twitch OAuth
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/twitch/callback:
    get:
      tags:
        - Authentication
      summary: Twitch OAuth callback
      description: Handles OAuth callback from Twitch (rate limited - 50/minute)
      operationId: handleTwitchCallback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Authentication
      summary: PKCE OAuth callback
      description: Handles PKCE OAuth callback (rate limited - 50/minute)
      operationId: handlePKCECallback
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - code_verifier
              properties:
                code:
                  type: string
                code_verifier:
                  type: string
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/test-login:
    post:
      tags:
        - Authentication
      summary: Test login (development only)
      description: Creates test user session for development (rate limited - 30/minute)
      operationId: testLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
      responses:
        '200':
          description: Test login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Refresh JWT access token using refresh token (rate limited - 50/minute)
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Invalidates current session and refresh tokens
      operationId: logout
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Returns currently authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/twitch/reauthorize:
    post:
      tags:
        - Authentication
      summary: Reauthorize Twitch
      description: Re-initiates Twitch OAuth flow for additional scopes (rate limited - 3/hour)
      operationId: reauthorizeTwitch
      responses:
        '200':
          description: Reauthorization initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorization_url:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/mfa/enroll:
    post:
      tags:
        - MFA
      summary: Start MFA enrollment
      description: Initiates MFA enrollment process (rate limited - 3/hour)
      operationId: startMFAEnrollment
      responses:
        '200':
          description: MFA enrollment started
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr_code:
                    type: string
                    description: Base64 encoded QR code
                  secret:
                    type: string
                  backup_codes:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/mfa/verify-enrollment:
    post:
      tags:
        - MFA
      summary: Verify MFA enrollment
      description: Completes MFA enrollment by verifying TOTP code (rate limited - 10/minute)
      operationId: verifyMFAEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: 6-digit TOTP code
      responses:
        '200':
          description: MFA enrollment verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/mfa/status:
    get:
      tags:
        - MFA
      summary: Get MFA status
      description: Returns MFA enrollment status for current user
      operationId: getMFAStatus
      responses:
        '200':
          description: MFA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  enrolled_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/mfa/regenerate-backup-codes:
    post:
      tags:
        - MFA
      summary: Regenerate backup codes
      description: Generates new backup codes (rate limited - 5/hour)
      operationId: regenerateBackupCodes
      responses:
        '200':
          description: New backup codes generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup_codes:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/mfa/disable:
    post:
      tags:
        - MFA
      summary: Disable MFA
      description: Disables MFA for current user (rate limited - 3/hour)
      operationId: disableMFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: 6-digit TOTP code or backup code
      responses:
        '200':
          description: MFA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  disabled:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/mfa/trusted-devices:
    get:
      tags:
        - MFA
      summary: Get trusted devices
      description: Returns list of trusted devices for MFA
      operationId: getTrustedDevices
      responses:
        '200':
          description: List of trusted devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrustedDevice'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/mfa/trusted-devices/{id}:
    delete:
      tags:
        - MFA
      summary: Revoke trusted device
      description: Removes a device from trusted devices list
      operationId: revokeTrustedDevice
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Trusted device revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/mfa/verify-login:
    post:
      tags:
        - MFA
      summary: Verify MFA login
      description: Verifies MFA code during login (rate limited - 10/minute)
      operationId: verifyMFALogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - code
              properties:
                session_id:
                  type: string
                code:
                  type: string
                  description: 6-digit TOTP code or backup code
                trust_device:
                  type: boolean
      responses:
        '200':
          description: MFA verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/clips:
    get:
      tags:
        - Clips
      summary: List clips
      description: Returns paginated list of clips with filtering and sorting options
      operationId: listClips
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - hot
              - trending
              - new
              - top
              - controversial
            default: hot
        - name: game
          in: query
          schema:
            type: string
          description: Filter by game name
        - name: broadcaster
          in: query
          schema:
            type: string
          description: Filter by broadcaster name
        - name: tag
          in: query
          schema:
            type: string
          description: Filter by tag slug
        - name: language
          in: query
          schema:
            type: string
          description: Filter by language code
        - name: time_range
          in: query
          schema:
            type: string
            enum:
              - hour
              - day
              - week
              - month
              - year
              - all
          description: Time range for 'top' sort
      responses:
        '200':
          description: List of clips
          content:
            application/json:
              schema:
                type: object
                properties:
                  clips:
                    type: array
                    items:
                      $ref: '#/components/schemas/Clip'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/clips/{id}:
    get:
      tags:
        - Clips
      summary: Get clip by ID
      description: Returns detailed information about a specific clip
      operationId: getClip
      security: []
      parameters:
        - $ref: '#/components/parameters/ClipId'
      responses:
        '200':
          description: Clip details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipDetailed'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Clips
      summary: Update clip (Admin)
      description: Updates clip metadata (admin/moderator only)
      operationId: updateClip
      parameters:
        - $ref: '#/components/parameters/ClipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                is_featured:
                  type: boolean
                is_nsfw:
                  type: boolean
                is_hidden:
                  type: boolean
      responses:
        '200':
          description: Clip updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Clips
      summary: Delete clip (Admin)
      description: Permanently deletes a clip (admin only)
      operationId: deleteClip
      parameters:
        - $ref: '#/components/parameters/ClipId'
      responses:
        '204':
          description: Clip deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/clips/{id}/related:
    get:
      tags:
        - Clips
      summary: Get related clips
      description: Returns clips related to the specified clip
      operationId: getRelatedClips
      security: []
      parameters:
        - $ref: '#/components/parameters/ClipId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Related clips
          content:
            application/json:
              schema:
                type: object
                properties:
                  clips:
                    type: array
                    items:
                      $ref: '#/components/schemas/Clip'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/clips/batch-media:
    post:
      tags:
        - Clips
      summary: Batch get clip media URLs
      description: Returns media URLs for multiple clips (rate limited - 60/minute)
      operationId: batchGetClipMedia
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clip_ids
              properties:
                clip_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 50
      responses:
        '200':
          description: Clip media URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  media:
                    type: array
                    items:
                      type: object
                      properties:
                        clip_id:
                          type: string
                          format: uuid
                        video_url:
                          type: string
                        thumbnail_url:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/clips/{id}/tags:
    get:
      tags:
        - Tags
      summary: Get clip tags
      description: Returns all tags associated with a clip
      operationId: getClipTags
      security: []
      parameters:
        - $ref: '#/components/parameters/ClipId'
