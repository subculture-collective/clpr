components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from authentication endpoints
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly JWT session cookie. State-changing requests authenticated this way also require the csrf_token cookie value in X-CSRF-Token.
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for POST, PUT, PATCH, and DELETE when authentication uses the access_token cookie; not required with BearerAuth.
      schema:
        type: string
        minLength: 43
        maxLength: 64
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number for pagination
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource ID
    ClipId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Clip ID
    TagSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: Tag slug
  responses:
    RouterDerivedSuccess:
      description: Successful response from a router-derived operation whose route-specific schema remains to be documented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RouterDerivedPayload'
    BadRequest:
      description: Bad Request - Invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too Many Requests - Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Service Unavailable - Service is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal Server Error - Request processing failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AccountTypeConversion:
      type: object
      required:
        - id
        - user_id
        - old_type
        - new_type
        - converted_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        old_type:
          type: string
          enum:
            - member
            - broadcaster
            - moderator
            - admin
        new_type:
          type: string
          enum:
            - member
            - broadcaster
            - moderator
            - admin
        reason:
          type:
            - string
            - 'null'
        converted_by:
          type:
            - string
            - 'null'
          format: uuid
        converted_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    AccountTypeInfo:
      type: object
      required:
        - account_type
        - permissions
      properties:
        account_type:
          type: string
          enum:
            - member
            - broadcaster
            - moderator
            - admin
        updated_at:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: string
        conversion_history:
          type: array
          items:
            $ref: '#/components/schemas/AccountTypeConversion'
    AccountTypeStatsResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - member
            - broadcaster
            - moderator
            - admin
          properties:
            member:
              type: integer
              minimum: 0
            broadcaster:
              type: integer
              minimum: 0
            moderator:
              type: integer
              minimum: 0
            admin:
              type: integer
              minimum: 0
    AccountTypeInfoResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/AccountTypeInfo'
    AccountTypeConversionsResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - conversions
            - total
            - limit
            - offset
          properties:
            conversions:
              type: array
              items:
                $ref: '#/components/schemas/AccountTypeConversion'
            total:
              type: integer
              minimum: 0
            limit:
              type: integer
              minimum: 1
              maximum: 100
            offset:
              type: integer
              minimum: 0
    AccountTypeConversionResult:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/AccountTypeInfo'
    WebhookSubscription:
      type: object
      required:
        - id
        - user_id
        - url
        - events
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
        is_active:
          type: boolean
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_delivery_at:
          type:
            - string
            - 'null'
          format: date-time
    WebhookDelivery:
      type: object
      required:
        - id
        - subscription_id
        - event_type
        - event_id
        - payload
        - status
        - attempt_count
        - max_attempts
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        event_type:
          type: string
        event_id:
          type: string
          format: uuid
        payload:
          type: string
        status:
          type: string
        http_status_code:
          type:
            - integer
            - 'null'
          minimum: 100
          maximum: 599
        response_body:
          type:
            - string
            - 'null'
        error_message:
          type:
            - string
            - 'null'
        attempt_count:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        next_attempt_at:
          type:
            - string
            - 'null'
          format: date-time
        delivered_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateWebhookSubscriptionRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            enum:
              - clip.submitted
              - clip.approved
              - clip.rejected
        description:
          type:
            - string
            - 'null'
          maxLength: 500
    UpdateWebhookSubscriptionRequest:
      type: object
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            enum:
              - clip.submitted
              - clip.approved
              - clip.rejected
        is_active:
          type: boolean
        description:
          type:
