<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="alternate icon" type="image/x-icon" href="/favicon_io/favicon.ico" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon_io/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon_io/favicon-16x16.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="/favicon_io/android-chrome-192x192.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="512x512"
            href="/favicon_io/android-chrome-512x512.png"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="theme-color"
            content="#ffffff"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#0F0F14"
            media="(prefers-color-scheme: dark)"
        />

        <!-- PWA Manifest -->
        <link rel="manifest" href="/manifest.json" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/favicon_io/apple-touch-icon.png"
        />

        <!-- Google Fonts preconnect -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- Preconnect to external domains for better performance -->
        <link rel="preconnect" href="https://clips.twitch.tv" crossorigin />
        <link
            rel="preconnect"
            href="https://static-cdn.jtvnw.net"
            crossorigin
        />

        <!-- Default SEO tags (will be overridden by react-helmet-async) -->
        <title>clpr - Discover Creators and Live Moments</title>
        <meta
            name="description"
            content="Discover the creators and moments shaping live culture. Browse Twitch clips by creator, topic, tag, or collection."
        />

        <!-- Default Open Graph tags -->
        <meta property="og:site_name" content="clpr" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://clpr.tv/" />
        <meta
            property="og:title"
            content="clpr - Discover Creators and Live Moments"
        />
        <meta
            property="og:description"
            content="Discover the creators and moments shaping live culture. Browse Twitch clips by creator, topic, tag, or collection."
        />
        <meta property="og:image" content="https://clpr.tv/social-card.png" />
        <meta property="og:image:secure_url" content="https://clpr.tv/social-card.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="clpr — Discover creators and live moments" />

        <!-- Default Twitter Card tags -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:site" content="@clpr_tv" />
        <meta name="twitter:creator" content="@clpr_tv" />
        <meta name="twitter:domain" content="clpr.tv" />
        <meta name="twitter:url" content="https://clpr.tv/" />
        <meta
            name="twitter:title"
            content="clpr - Discover Creators and Live Moments"
        />
        <meta
            name="twitter:description"
            content="Discover the creators and moments shaping live culture. Browse Twitch clips by creator, topic, tag, or collection."
        />
        <meta name="twitter:image" content="https://clpr.tv/social-card.png" />
        <meta name="twitter:image:alt" content="clpr — Discover creators and live moments" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
