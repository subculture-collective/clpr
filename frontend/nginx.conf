worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Never advertise the nginx version, and keep redirects relative so the
    # internal listen port never leaks through the Caddy/Cloudflare edge.
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    # Generated from active React Router declarations during the image build.
    include /etc/nginx/edge-routes.conf;

    # Rendered at container start by the nginx image entrypoint from
    # /etc/nginx/templates/clpr-backend.conf.template. Defines the resolver and
    # $clpr_backend_url (BACKEND_URL, default http://clpr-backend:8080).
    include /tmp/clpr-backend.conf;

    # Directories are never served. URIs ending in "/" are looked up as a file
    # that cannot exist, so they fall through to SPA routing instead of the
    # index/redirect/403 directory behavior.
    map $uri $clpr_static_file {
        default $uri;
        ~/$ /.clpr-no-directory-listing;
    }

    # Link-preview crawlers that do not execute JavaScript. Search engines are
    # deliberately absent so they keep receiving the SPA.
    map $http_user_agent $clpr_preview_bot {
        default 0;
        "~*(discordbot|twitterbot|facebookexternalhit|facebot|slackbot|slack-imgproxy|telegrambot|linkedinbot|whatsapp|embedly|mastodon|redditbot|skypeuripreview|iframely|vkshare|pinterest|cardyb|bluesky)" 1;
    }

    map $uri $clpr_clip_route_id {
        default "";
        "~^/clips?/(?<clpr_clip_id>[A-Za-z0-9_-]{1,128})/?$" $clpr_clip_id;
    }

    # Clip ID to render as a link preview, or empty for the SPA.
    map $clpr_preview_bot $clpr_clip_preview_id {
        default "";
        1 $clpr_clip_route_id;
    }

    # Clip pages vary by user agent (preview document versus SPA shell).
    map $clpr_clip_route_id $clpr_clip_vary {
        default "User-Agent";
        "" "";
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    server {
        listen 8080;
        add_header_inherit merge;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers (defense-in-depth - Caddy also sets these)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

        # Site isolation headers for Spectre mitigation
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://embed.twitch.tv https://www.googletagmanager.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://static-cdn.jtvnw.net https://*.twitchcdn.net https://*.twitch.tv https://api.dicebear.com https://us-assets.i.posthog.com; media-src 'self' blob: https://clips-media-assets2.twitch.tv https://clips.twitch.tv https://static.twitchcdn.net; frame-src 'self' https://clips.twitch.tv https://player.twitch.tv https://embed.twitch.tv; connect-src 'self' wss: https://api.twitch.tv https://gql.twitch.tv https://*.posthog.com https://*.i.posthog.com https://*.ingest.sentry.io https://www.google-analytics.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

        # Note: CSP is set at Caddy level to allow easier updates without rebuilding frontend
        # If accessing nginx directly (dev/testing), add CSP here too

        # Don't cache index.html - always get fresh version
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Standards-based alias for the canonical manifest.json payload.
        location = /manifest.webmanifest {
            default_type application/manifest+json;
            try_files /manifest.json =404;
            add_header Cache-Control "public, max-age=3600";
        }

        # SPA routing - declared React routes receive the application shell with
        # 200. Unknown paths receive the same shell with 404 so the SPA renders
        # its branded not-found page while crawlers still see the 404 status.
        location / {
            try_files $clpr_static_file @spa_route;
        }

        location @spa_route {
            error_page 404 /index.html;
            error_page 418 = @clip_preview;
            # Lets @clip_preview fall back to the shell on upstream errors.
            recursive_error_pages on;
            # Capture before try_files rewrites $uri to /index.html.
            set $clpr_clip_vary_header $clpr_clip_vary;
            add_header Vary $clpr_clip_vary_header;
            if ($clpr_clip_preview_id) {
                return 418;
            }
            if ($clpr_spa_route = 0) {
                return 404;
            }
            try_files /index.html =404;
        }

        # Per-clip OpenGraph/Twitter tags for link-preview crawlers, rendered by
        # the backend (GET /api/v1/share/clips/:id). If the backend is
        # unavailable the crawler receives the SPA shell's site-wide tags.
        location @clip_preview {
            add_header Vary "User-Agent" always;
            proxy_method GET;
            proxy_pass $clpr_backend_url/api/v1/share/clips/$clpr_clip_preview_id;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            # nginx adds the edge security headers itself.
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-XSS-Protection;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
            proxy_hide_header Cross-Origin-Resource-Policy;
            proxy_hide_header Cross-Origin-Embedder-Policy;
            proxy_hide_header Set-Cookie;
            proxy_intercept_errors on;
            error_page 500 502 503 504 =200 /index.html;
        }

        # Generated API reference and OpenAPI source, served as readable text.
        location ^~ /openapi/ {
            types { }
            default_type text/plain;
            charset utf-8;
            add_header Cache-Control "public, max-age=3600";
            try_files $clpr_static_file =404;
        }

        # Earlier releases published the generated reference under /docs/,
        # which collided with the SPA /docs page.
        location ^~ /docs/openapi/ {
            rewrite ^/docs/openapi/(?:generated/)?([^/]+)$ /openapi/$1 permanent;
            return 404;
        }

        # Content-hashed build output: file names change with content, so it is
        # safe to cache for a year.
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $clpr_static_file =404;
        }

        # The service worker must be revalidated so updates reach installed clients.
        location = /sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Un-hashed public files (logos, icons, social card) keep their names when
        # replaced, so they get a short cache instead of an immutable one.
        location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=3600";
            try_files $uri @spa_route;
        }

        # Nginx stub status for exporter (internal only)
        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }

        # Health check endpoint
        location /health.html {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
