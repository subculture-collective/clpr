groups:
  - name: clpr-journey-slos
    interval: 30s
    rules:
      - record: clpr:journey_availability:ratio5m
        labels: {journey: authentication}
        expr: sum(rate(http_requests_total{path=~"/api/v1/auth/.*",status!~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{path=~"/api/v1/auth/.*"}[5m])), 0.000001)
      - record: clpr:journey_availability:ratio5m
        labels: {journey: feed}
        expr: sum(rate(http_requests_total{path=~"/api/v1/(feed|feeds)(/.*)?",status!~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{path=~"/api/v1/(feed|feeds)(/.*)?"}[5m])), 0.000001)
      - record: clpr:journey_availability:ratio5m
        labels: {journey: search}
        expr: sum(rate(http_requests_total{path=~"/api/v1/search(/.*)?",status!~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{path=~"/api/v1/search(/.*)?"}[5m])), 0.000001)
      - record: clpr:journey_availability:ratio5m
        labels: {journey: playback}
        expr: sum(rate(http_requests_total{path=~"/api/v1/clips/[^/]+",status!~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{path=~"/api/v1/clips/[^/]+"}[5m])), 0.000001)
      - record: clpr:journey_availability:ratio5m
        labels: {journey: submission}
        expr: sum(rate(http_requests_total{path=~"/api/v1/submissions(/.*)?",status!~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{path=~"/api/v1/submissions(/.*)?"}[5m])), 0.000001)
      - record: clpr:journey_availability:ratio5m
        labels: {journey: checkout}
        expr: sum(rate(http_requests_total{path=~"/api/v1/subscriptions/(checkout|portal)",status!~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{path=~"/api/v1/subscriptions/(checkout|portal)"}[5m])), 0.000001)
      - record: clpr:journey_availability:ratio5m
        labels: {journey: moderation}
        expr: sum(rate(http_requests_total{path=~"/api/v1/(moderation|admin/moderation)(/.*)?",status!~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{path=~"/api/v1/(moderation|admin/moderation)(/.*)?"}[5m])), 0.000001)

      - record: clpr:journey_latency_p95:seconds5m
        labels: {journey: authentication}
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{path=~"/api/v1/auth/.*"}[5m])))
      - record: clpr:journey_latency_p95:seconds5m
        labels: {journey: feed}
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{path=~"/api/v1/(feed|feeds)(/.*)?"}[5m])))
      - record: clpr:journey_latency_p95:seconds5m
        labels: {journey: search}
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{path=~"/api/v1/search(/.*)?"}[5m])))
      - record: clpr:journey_latency_p95:seconds5m
        labels: {journey: playback}
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{path=~"/api/v1/clips/[^/]+"}[5m])))
      - record: clpr:journey_latency_p95:seconds5m
        labels: {journey: submission}
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{path=~"/api/v1/submissions(/.*)?"}[5m])))
      - record: clpr:journey_latency_p95:seconds5m
        labels: {journey: checkout}
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{path=~"/api/v1/subscriptions/(checkout|portal)"}[5m])))
      - record: clpr:journey_latency_p95:seconds5m
        labels: {journey: moderation}
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{path=~"/api/v1/(moderation|admin/moderation)(/.*)?"}[5m])))

      - alert: ClprJourneyAvailabilityFastBurn
        expr: clpr:journey_availability:ratio5m < 0.95
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "clpr {{ $labels.journey }} availability is below 95%"
          runbook_url: "docs/operations/playbooks/slo-breach-response.md#availability-breach"

      - alert: ClprJourneyLatencyBreach
        expr: (clpr:journey_latency_p95:seconds5m{journey=~"authentication|feed|playback"} > 1) or (clpr:journey_latency_p95:seconds5m{journey="search"} > 1.5) or (clpr:journey_latency_p95:seconds5m{journey=~"submission|moderation"} > 2) or (clpr:journey_latency_p95:seconds5m{journey="checkout"} > 3)
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "clpr {{ $labels.journey }} p95 latency exceeds twice its SLO"
          runbook_url: "docs/operations/playbooks/slo-breach-response.md#latency-breach"

      - alert: ClprWebhookDeadLetterQueueNotEmpty
        expr: webhook_dead_letter_queue_size > 0
        for: 5m
        labels: {severity: page, journey: checkout}
        annotations:
          summary: "Stripe/outbound webhook dead-letter queue is not empty"
          runbook_url: "docs/operations/runbooks/webhook-dlq-replay-runbook.md"

  - name: clpr-background-automation
    interval: 30s
    rules:
      - alert: ClprTrendingScoreStale
        expr: (time() - job_last_success_timestamp_seconds{job_name="trending_score_refresh"} > 7200) or absent(job_last_success_timestamp_seconds{job_name="trending_score_refresh"})
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "clpr trending scores have not refreshed successfully for two hours"
          runbook_url: "docs/operations/runbooks/background-jobs.md#job-not-running-stale"
      - alert: ClprScoringRefreshRepeatedFailures
        expr: increase(job_execution_total{job_name=~"trending_score_refresh|hot_score_refresh",status="failed"}[15m]) >= 2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "clpr scoring automation is repeatedly failing"
          runbook_url: "docs/operations/runbooks/background-jobs.md#job-failures"
      - alert: ClprStructuralTagBacklogGrowing
        expr: job_queue_size{job_name="auto_tag_processing"} > 100 and deriv(job_queue_size{job_name="auto_tag_processing"}[30m]) > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "clpr structural tag backlog exceeds 100 clips"
          runbook_url: "docs/operations/runbooks/background-jobs.md#job-not-running-stale"
      - alert: ClprTagPromotionDetectionStale
        expr: (time() - job_last_success_timestamp_seconds{job_name="tag_promotion_detection"} > 3600) or absent(job_last_success_timestamp_seconds{job_name="tag_promotion_detection"})
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "clpr tag promotion detection has not succeeded for one hour"
          runbook_url: "docs/operations/runbooks/background-jobs.md#job-not-running-stale"
      - alert: ClprHandlerBackgroundJobsDropped
        expr: increase(handler_background_jobs_dropped_total[15m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "clpr handler background work was dropped because its queue was full"
          runbook_url: "docs/operations/runbooks/background-jobs.md#job-failures"

  # Countdown worker on the render host (#80). Prometheus scrapes it as job
  # clpr-countdown-media on port 9464.
  - name: clpr-countdowns
    interval: 1m
    rules:
      - alert: ClprCountdownWorkerDown
        expr: up{job="clpr-countdown-media"} == 0
        for: 10m
        labels: {severity: critical, project: clpr}
        annotations:
          summary: "The countdown worker on {{ $labels.instance }} is not answering scrapes"
          runbook_url: "docs/operations/runbooks/countdowns.md#worker-down-or-stalled"
      - alert: ClprCountdownWorkerStalled
        expr: time() - clpr_countdown_media_last_run_timestamp_seconds > 1800
        for: 5m
        labels: {severity: warning, project: clpr}
        annotations:
          summary: "The countdown worker has not finished a cycle without errors for 30 minutes"
          runbook_url: "docs/operations/runbooks/countdowns.md#worker-down-or-stalled"
      - alert: ClprCountdownEditionMissed
        expr: clpr_countdown_edition_overdue_seconds{stage="rendered"} > 10800
        for: 5m
        labels: {severity: critical, project: clpr}
        annotations:
          summary: "Countdown series {{ $labels.series }} has no rendered edition 3 hours after its selection hour"
          runbook_url: "docs/operations/runbooks/countdowns.md#missed-edition"
      - alert: ClprCountdownEditionNotPublished
        expr: clpr_countdown_edition_overdue_seconds{stage="published"} > 86400
        for: 10m
        labels: {severity: warning, project: clpr}
        annotations:
          summary: "Countdown series {{ $labels.series }} has not been published to YouTube for a day past its selection hour"
          runbook_url: "docs/operations/runbooks/countdowns.md#not-published"
      - alert: ClprCountdownEditionFailed
        expr: sum by (stage) (label_replace(increase(clpr_countdown_media_editions_total{outcome="failed"}[1h]), "stage", "fetch", "", "") or label_replace(increase(clpr_countdown_render_editions_total{outcome="failed"}[1h]), "stage", "render", "", "") or label_replace(increase(clpr_countdown_publish_editions_total{outcome="failed"}[1h]), "stage", "publish", "", "")) > 0
        labels: {severity: warning, project: clpr}
        annotations:
          summary: "A countdown edition failed at the {{ $labels.stage }} stage"
          runbook_url: "docs/operations/runbooks/countdowns.md#failed-edition"
      - alert: ClprCountdownUploadFailed
        expr: sum by (kind) (increase(clpr_countdown_youtube_uploads_total{kind=~"countdown|short",outcome="failed"}[1h])) > 0
        labels: {severity: warning, project: clpr}
        annotations:
          summary: "A YouTube upload of a countdown {{ $labels.kind }} failed"
          runbook_url: "docs/operations/runbooks/countdowns.md#upload-failed"
      - alert: ClprCountdownYouTubeQuotaReached
        expr: increase(clpr_countdown_publish_editions_total{outcome="quota"}[6h]) > 0
        labels: {severity: warning, project: clpr}
        annotations:
          summary: "YouTube quota or the channel's upload limit stopped publishing until 08:00 UTC"
          runbook_url: "docs/operations/runbooks/countdowns.md#upload-failed"
      - alert: ClprCountdownYouTubeAuthFailed
        expr: increase(clpr_countdown_publish_editions_total{outcome="auth"}[2h]) > 0
        labels: {severity: critical, project: clpr}
        annotations:
          summary: "YouTube rejected the channel authorization; publishing is paused"
          runbook_url: "docs/operations/runbooks/countdowns.md#youtube-authorization"
