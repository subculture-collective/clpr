# Blue-Green Deployment Configuration
# Allows running two versions simultaneously for zero-downtime deployments
# Switch traffic via the proxy/load balancer

services:
    # BLUE environment (current production)
    backend-blue:
        image: ghcr.io/subculture-collective/clpr/backend@${BACKEND_BLUE_DIGEST:?BACKEND_BLUE_DIGEST is required}
        container_name: clpr-backend-blue
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--spider',
                    '-q',
                    'http://localhost:8080/health',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        environment:
            - PORT=8080
            - ENVIRONMENT=production
            - DEPLOYMENT_SLOT=blue
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_USER=${POSTGRES_USER:-clpr}
            - DB_PASSWORD=${POSTGRES_PASSWORD}
            - DB_NAME=${POSTGRES_DB:-clpr_db}
            - DB_SSLMODE=${DB_SSLMODE:-verify-full}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_DB=0
            - GIN_MODE=release
            - BASE_URL=${BASE_URL:-https://clpr.tv}
            - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
            - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
            - OPERATIONAL_AUTH_TOKEN=${OPERATIONAL_AUTH_TOKEN:?OPERATIONAL_AUTH_TOKEN is required}
            - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
            - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
            - TWITCH_REDIRECT_URI=${TWITCH_REDIRECT_URI:-https://clpr.tv/api/v1/auth/twitch/callback}
            - TWITCH_PLATFORM_REDIRECT_URI=${TWITCH_PLATFORM_REDIRECT_URI:-https://clpr.tv/api/v1/twitch/oauth/callback}
            - TWITCH_BOT_USERNAME=${TWITCH_BOT_USERNAME:-clpr_bot}
            - TWITCH_BOT_OAUTH_TOKEN=${TWITCH_BOT_OAUTH_TOKEN:-}
            - OPENSEARCH_URL=${OPENSEARCH_URL:?OPENSEARCH_URL is required}
            - OPENSEARCH_INSECURE_SKIP_VERIFY=false
            - CLIP_MAX_DURATION_SECONDS=${CLIP_MAX_DURATION_SECONDS}
            - CLIP_RECOMMENDED_DURATION_SECONDS=${CLIP_RECOMMENDED_DURATION_SECONDS}
            - CLIP_MAX_UPLOAD_BYTES=${CLIP_MAX_UPLOAD_BYTES}
            - CLIP_ALLOWED_UPLOAD_MIME_TYPES=${CLIP_ALLOWED_UPLOAD_MIME_TYPES}
            - CLIP_REQUIRE_MODERATION_FOR_UPLOAD=${CLIP_REQUIRE_MODERATION_FOR_UPLOAD}
            - CLIP_STORAGE_PROVIDER=${CLIP_STORAGE_PROVIDER}
            - CLIP_STORAGE_ENDPOINT=${CLIP_STORAGE_ENDPOINT}
            - CLIP_STORAGE_BUCKET=${CLIP_STORAGE_BUCKET}
            - CLIP_STORAGE_REGION=${CLIP_STORAGE_REGION}
            - CLIP_STORAGE_ACCESS_KEY=${CLIP_STORAGE_ACCESS_KEY}
            - CLIP_STORAGE_SECRET_KEY=${CLIP_STORAGE_SECRET_KEY}
            - CLIP_STORAGE_FORCE_PATH_STYLE=${CLIP_STORAGE_FORCE_PATH_STYLE}
            - CLIP_STORAGE_PUBLIC_BASE_URL=${CLIP_STORAGE_PUBLIC_BASE_URL}
            - CLIP_MEDIA_PUBLIC_BASE_URL=${CLIP_MEDIA_PUBLIC_BASE_URL}
            - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://clpr.tv}
            - WEBSOCKET_ALLOWED_ORIGINS=${WEBSOCKET_ALLOWED_ORIGINS:-https://clpr.tv}
            - LOG_LEVEL=info
        networks:
            - clpr-network
        read_only: true
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=64m
            - /app/exports:rw,noexec,nosuid,size=256m,uid=10001,gid=10001
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        pids_limit: 256
        mem_limit: 768m
        cpus: 1.5

    frontend-blue:
        image: ghcr.io/subculture-collective/clpr/frontend@${FRONTEND_BLUE_DIGEST:?FRONTEND_BLUE_DIGEST is required}
        container_name: clpr-frontend-blue
        restart: unless-stopped
        depends_on:
            - backend-blue
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--spider',
                    '-q',
                    'http://localhost:8080/health.html',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 5s
        environment:
            - BACKEND_URL=http://backend-blue:8080
        networks:
            - clpr-network
        read_only: true
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=64m,uid=101,gid=101
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        pids_limit: 128
        mem_limit: 256m
        cpus: 0.5

    # GREEN environment (new version during deploy)
    backend-green:
        image: ghcr.io/subculture-collective/clpr/backend@${BACKEND_GREEN_DIGEST:?BACKEND_GREEN_DIGEST is required}
        container_name: clpr-backend-green
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--spider',
                    '-q',
                    'http://localhost:8080/health',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        environment:
            - PORT=8080
            - ENVIRONMENT=production
            - DEPLOYMENT_SLOT=green
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_USER=${POSTGRES_USER:-clpr}
            - DB_PASSWORD=${POSTGRES_PASSWORD}
            - DB_NAME=${POSTGRES_DB:-clpr_db}
            - DB_SSLMODE=${DB_SSLMODE:-verify-full}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_DB=0
            - GIN_MODE=release
            - BASE_URL=${BASE_URL:-https://clpr.tv}
            - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
            - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
            - OPERATIONAL_AUTH_TOKEN=${OPERATIONAL_AUTH_TOKEN:?OPERATIONAL_AUTH_TOKEN is required}
            - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
            - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
            - TWITCH_REDIRECT_URI=${TWITCH_REDIRECT_URI:-https://clpr.tv/api/v1/auth/twitch/callback}
            - TWITCH_PLATFORM_REDIRECT_URI=${TWITCH_PLATFORM_REDIRECT_URI:-https://clpr.tv/api/v1/twitch/oauth/callback}
            - TWITCH_BOT_USERNAME=${TWITCH_BOT_USERNAME:-clpr_bot}
            - TWITCH_BOT_OAUTH_TOKEN=${TWITCH_BOT_OAUTH_TOKEN:-}
            - OPENSEARCH_URL=${OPENSEARCH_URL:?OPENSEARCH_URL is required}
            - OPENSEARCH_INSECURE_SKIP_VERIFY=false
            - CLIP_MAX_DURATION_SECONDS=${CLIP_MAX_DURATION_SECONDS}
            - CLIP_RECOMMENDED_DURATION_SECONDS=${CLIP_RECOMMENDED_DURATION_SECONDS}
            - CLIP_MAX_UPLOAD_BYTES=${CLIP_MAX_UPLOAD_BYTES}
            - CLIP_ALLOWED_UPLOAD_MIME_TYPES=${CLIP_ALLOWED_UPLOAD_MIME_TYPES}
            - CLIP_REQUIRE_MODERATION_FOR_UPLOAD=${CLIP_REQUIRE_MODERATION_FOR_UPLOAD}
            - CLIP_STORAGE_PROVIDER=${CLIP_STORAGE_PROVIDER}
            - CLIP_STORAGE_ENDPOINT=${CLIP_STORAGE_ENDPOINT}
            - CLIP_STORAGE_BUCKET=${CLIP_STORAGE_BUCKET}
            - CLIP_STORAGE_REGION=${CLIP_STORAGE_REGION}
            - CLIP_STORAGE_ACCESS_KEY=${CLIP_STORAGE_ACCESS_KEY}
            - CLIP_STORAGE_SECRET_KEY=${CLIP_STORAGE_SECRET_KEY}
            - CLIP_STORAGE_FORCE_PATH_STYLE=${CLIP_STORAGE_FORCE_PATH_STYLE}
            - CLIP_STORAGE_PUBLIC_BASE_URL=${CLIP_STORAGE_PUBLIC_BASE_URL}
            - CLIP_MEDIA_PUBLIC_BASE_URL=${CLIP_MEDIA_PUBLIC_BASE_URL}
            - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://clpr.tv}
            - WEBSOCKET_ALLOWED_ORIGINS=${WEBSOCKET_ALLOWED_ORIGINS:-https://clpr.tv}
            - LOG_LEVEL=info
        networks:
            - clpr-network
        read_only: true
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=64m
            - /app/exports:rw,noexec,nosuid,size=256m,uid=10001,gid=10001
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        pids_limit: 256
        mem_limit: 768m
        cpus: 1.5
        profiles:
            - green # Only starts when explicitly requested

    frontend-green:
        image: ghcr.io/subculture-collective/clpr/frontend@${FRONTEND_GREEN_DIGEST:?FRONTEND_GREEN_DIGEST is required}
        container_name: clpr-frontend-green
        restart: unless-stopped
        depends_on:
            - backend-green
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--spider',
                    '-q',
                    'http://localhost:8080/health.html',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 5s
        environment:
            - BACKEND_URL=http://backend-green:8080
        networks:
            - clpr-network
        read_only: true
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=64m,uid=101,gid=101
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        pids_limit: 128
        mem_limit: 256m
        cpus: 0.5
        profiles:
            - green # Only starts when explicitly requested

    # Exactly one crawler is shared by both application slots. It is reconciled
    # only after traffic promotion so blue and green never scrape concurrently.
    crawler:
        image: ghcr.io/subculture-collective/clpr/crawler@${CRAWLER_DIGEST:?CRAWLER_DIGEST is required}
        container_name: clpr-crawler
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        user: '10001:10001'
        environment:
            - ENVIRONMENT=production
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_USER=${POSTGRES_USER:-clpr}
            - DB_PASSWORD=${POSTGRES_PASSWORD}
            - DB_NAME=${POSTGRES_DB:-clpr_db}
            - DB_SSLMODE=${DB_SSLMODE:-verify-full}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_DB=0
            - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:?TWITCH_CLIENT_ID is required}
            - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:?TWITCH_CLIENT_SECRET is required}
            - SCRAPE_INTERVAL=${SCRAPE_INTERVAL:-1800}
            - SCRAPE_MIN_VIEWS=${SCRAPE_MIN_VIEWS:-50}
            - SCRAPE_MAX_AGE_DAYS=${SCRAPE_MAX_AGE_DAYS:-7}
            - SCRAPE_BATCH_SIZE=${SCRAPE_BATCH_SIZE:-50}
            - SCRAPE_BROADCASTERS=${SCRAPE_BROADCASTERS:-}
        networks:
            - clpr-network
        read_only: true
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        pids_limit: 128
        mem_limit: 256m
        cpus: 0.5

    # Shared Services
    postgres:
        build:
            context: .
            dockerfile: Dockerfile.postgres
        container_name: clpr-postgres
        restart: unless-stopped
        environment:
            - POSTGRES_DB=${POSTGRES_DB:-clpr_db}
            - POSTGRES_USER=${POSTGRES_USER:-clpr}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        ports:
            - '5436:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER:-clpr} -d ${POSTGRES_DB:-clpr_db}',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - clpr-network

    redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        container_name: clpr-redis
        restart: unless-stopped
        command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        networks:
            - clpr-network

    # Caddy reverse proxy for traffic switching
    caddy:
        image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
        container_name: clpr-caddy
        restart: unless-stopped
        depends_on:
            - backend-blue
            - frontend-blue
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ${CLPR_RUNTIME_DIR:?CLPR_RUNTIME_DIR is required}:/etc/caddy/runtime:ro
            - caddy_data:/data
            - caddy_config:/config
            - caddy_logs:/var/log/caddy
        command: ['caddy', 'run', '--config', '/etc/caddy/runtime/Caddyfile']
        networks:
            - clpr-network
        read_only: true
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=32m
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        pids_limit: 128
        mem_limit: 256m
        cpus: 0.5
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--spider',
                    '-q',
                    'http://localhost:2019/config/',
                ]
            interval: 30s
            timeout: 10s
            retries: 3

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
    caddy_data:
        driver: local
    caddy_config:
        driver: local
    caddy_logs:
        driver: local

networks:
    clpr-network:
        driver: bridge
